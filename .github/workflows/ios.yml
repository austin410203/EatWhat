# iOS builds on a cloud Mac (no local Mac needed). Copied from StackMystery and trimmed (no IAP / ads plugins).
#  - "Run workflow": compile for the iOS Simulator (unsigned), launch it and screenshot the first screen
#  - "Run workflow" with testflight=true: also archive, sign and upload to TestFlight
#    needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key with the Admin role, .p8 contents)
#    and an App Store Connect app record for com.austin410203.eatwhat (app 6830219160). Signing is Xcode cloud signing;
#    scripts/asc_signing.py (manual certificate per run) is kept only for reference.
# Manual only: the repo is private and macOS minutes count 10x against the free Actions quota.
# macos-15-intel: arm64 macOS runners kept failing with "not acquired ... capacity constraints" (2026-11-03).
# Uploads must be built with Xcode 26 / the iOS 26 SDK (App Store rule since 2026-04-28).
name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

# explicit bash = -eo pipefail, so a failing xcodebuild piped into `tail` still fails the step
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Launch in the simulator
        run: |
          mkdir -p ci-out
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt in sorted(devs, reverse=True):
              if 'iOS' in rt:
                  for d in devs[rt]:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          bash scripts/ci-launch-app.sh "$UDID" ci-out/app-stdout.log
          sleep 12
          xcrun simctl io "$UDID" screenshot ci-out/launch.png
          xcrun simctl terminate "$UDID" com.austin410203.eatwhat || true
          grep -E "⚡️|rror|xception" ci-out/app-stdout.log | tr -d '\r' | cut -c1-300 | head -200 > ci-out/app.log || true
          if grep -q "ERROR MESSAGE" ci-out/app.log; then echo "::error::JavaScript error at launch"; cat ci-out/app.log; exit 1; fi
          echo "OK: app launched"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim
          path: ci-out
          if-no-files-found: ignore

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          K="$RUNNER_TEMP/keys/AuthKey.p8"
          # a Notepad paste brings \r; add the BEGIN/END lines if they were left out
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$K"
          if ! grep -q 'BEGIN PRIVATE KEY' "$K"; then
            { echo '-----BEGIN PRIVATE KEY-----'; tr -d ' \n' < "$K" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$K.tmp" && mv "$K.tmp" "$K"
          fi
          openssl pkey -in "$K" -noout || { echo "::error::ASC_KEY_P8 is not a valid private key"; exit 1; }
      # Xcode cloud signing (Apple's managed distribution certificate), as in DamJelly's testflight.yml:
      # the team is at Apple's 3-distribution-certificate limit (the managed one counts), so
      # scripts/asc_signing.py can no longer create a certificate per run. Needs an Admin-role API key.
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID || '69a6de98-2fa2-47e3-e053-5b8c7c11a4d1' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 60
      - name: Export and upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID || '69a6de98-2fa2-47e3-e053-5b8c7c11a4d1' }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 60
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
