# 原生 iOS App（native/，SwiftUI）在 GitHub 的雲端 Mac 上建置。不用本機 Mac。
#  - Run workflow：XcodeGen 產生專案 → 模擬器建置 → 每一頁截圖（推到 native-ci 分支的 shots/，方便在 Windows 上 git fetch 來看）
#  - 勾 testflight：再 Archive、Xcode 雲端簽章、上傳 TestFlight
# 需要 repo secrets：APPLE_TEAM_ID、ASC_KEY_ID、ASC_KEY_P8（Admin 角色的 App Store Connect API key）；ASC_ISSUER_ID 沒設就用預設值。
# 只能手動跑：private repo 的 macOS 分鐘數算 10 倍，跑之前先把 repo 改公開，跑完改回私人（公司規則）。
# 團隊已到 Apple 3 張發佈憑證上限（雲端管理那張也算），所以用 Xcode 雲端簽章，不再每次新建憑證。
name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd native && xcodegen generate
      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project native/EatWhat.xcodeproj -scheme EatWhat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" | head -80
          test -d build/Build/Products/Debug-iphonesimulator/EatWhat.app
      - name: Screenshot every screen
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt in sorted(devs, reverse=True):
              if 'iOS' in rt:
                  for d in devs[rt]:
                      if d['name'].startswith('iPhone 1') and 'Pro' in d['name'] and 'Max' not in d['name']:
                          print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 12:10 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/EatWhat.app
          xcrun simctl privacy "$UDID" grant location com.austin410203.eatwhat || true
          xcrun simctl location "$UDID" set 25.0526,121.5204 || true
          for s in welcome decide explore map group swipe me; do
            xcrun simctl launch --terminate-running-process --console-pty "$UDID" com.austin410203.eatwhat -screen $s > "shots/$s.log" 2>&1 &
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
            xcrun simctl terminate "$UDID" com.austin410203.eatwhat || true
            sleep 1
          done
          ls -la shots
          if grep -l "Fatal error\|SIGABRT\|EXC_" shots/*.log; then echo "::error::the app crashed"; exit 1; fi
      - name: Publish screenshots to the native-ci branch
        if: always()
        run: |
          cp build.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b native-ci
          git config user.name "Empty Office CI"
          git config user.email "hello@emptyoffice.app"
          git add -A && git commit -qm "shots ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd native && xcodegen generate
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          K="$RUNNER_TEMP/keys/AuthKey.p8"
          # a Notepad paste brings \r; add the BEGIN/END lines if they were left out
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$K"
          if ! grep -q 'BEGIN PRIVATE KEY' "$K"; then
            { echo '-----BEGIN PRIVATE KEY-----'; tr -d ' \n' < "$K" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$K.tmp" && mv "$K.tmp" "$K"
          fi
          openssl pkey -in "$K" -noout || { echo "::error::ASC_KEY_P8 is not a valid private key"; exit 1; }
      # build numbers continue after the Capacitor builds (1–4)
      # Archive unsigned: signing the archive makes Xcode create an Apple Development certificate and the team is at
      # Apple's certificate limit (2026-11-20). -exportArchive below signs with the cloud-managed distribution cert.
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID || '69a6de98-2fa2-47e3-e053-5b8c7c11a4d1' }}
        run: |
          set -o pipefail
          xcodebuild -project native/EatWhat.xcodeproj -scheme EatWhat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/EatWhat.xcarchive archive \
            CURRENT_PROJECT_VERSION=$((100 + ${{ github.run_number }})) DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -n 60
      - name: Export and upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID || '69a6de98-2fa2-47e3-e053-5b8c7c11a4d1' }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/EatWhat.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tail -n 60
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
