# 原生 iOS App（SwiftUI）。CI 用 XcodeGen 產生 EatWhat.xcodeproj（不進 git）：brew install xcodegen && xcodegen generate
name: EatWhat
options:
  bundleIdPrefix: com.austin410203
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: M3FNV67WZ3
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  EatWhat:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/saved.json
      - path: Resources/place_photos.json
      - path: Resources/Art
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austin410203.eatwhat
        # 只做 iPhone：要寫在 target 層，XcodeGen 的 target 預設 "1,2" 會蓋掉專案層設定（iPad 會被要求支援所有方向）
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: EatWhat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 吃什麼
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: 用你的位置找附近的餐廳、計算距離和步行時間。
        NSPhotoLibraryUsageDescription: 管理員上傳店家照片時使用。
        LSApplicationQueriesSchemes: [comgooglemaps]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
